[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-guardian"
version = "0.2.0"
description = "Causal drift detection for B2B SaaS product analytics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
dependencies = [
    "dowhy>=0.12,<0.15",
    "pandas>=2.0,<3.0",
    "numpy>=1.26,<2.0",
    "statsmodels>=0.14,<0.15",
    "scipy>=1.11,<2.0",
    "pandera>=0.19,<0.21",
    "networkx>=3.1,<3.3",
    "pydot>=2.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    "ruff>=0.3",
    "mypy>=1.8",
    "pandas-stubs>=2.0",
    "pre-commit>=3.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests that run the full refutation suite (deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore:.*setName.*:pyparsing.exceptions.PyparsingDeprecationWarning:pydot\\.dot_parser",
    "ignore:.*escChar.*:pyparsing.exceptions.PyparsingDeprecationWarning:pydot\\.dot_parser",
    "ignore:.*unquoteResults.*:pyparsing.exceptions.PyparsingDeprecationWarning:pydot\\.dot_parser",
    "ignore:.*setParseAction.*:pyparsing.exceptions.PyparsingDeprecationWarning:pydot\\.dot_parser",
    "ignore:.*setResultsName.*:pyparsing.exceptions.PyparsingDeprecationWarning:pydot\\.dot_parser",
    "ignore:.*parseWithTabs.*:pyparsing.exceptions.PyparsingDeprecationWarning:pydot\\.dot_parser",
    "ignore:.*parseString.*:pyparsing.exceptions.PyparsingDeprecationWarning:pydot\\.dot_parser",
    "ignore:nx\\.nx_pydot\\.from_pydot depends on the pydot package.*:DeprecationWarning:networkx\\.utils\\.backends",
    "ignore:The 'warn' method is deprecated, use 'warning' instead:DeprecationWarning:dowhy\\.causal_model",
    "ignore:Series\\.__getitem__ treating keys as positions is deprecated.*:FutureWarning:dowhy\\.causal_estimators\\.regression_estimator",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
